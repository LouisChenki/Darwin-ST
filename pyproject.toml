[project]
name = "darwin-st"
version = "0.1.0"
description = "Autonomous spatio-temporal forecasting research agent (时空预测模型自动化研究 Agent Skill)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "requests>=2.32.0",
    "neo4j>=5.0.0",
    "torch==2.8.0",
]

[dependency-groups]
# 开发/测试依赖 (本地 P0 正确性验证用), 不进发布依赖
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/darwin_st"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
# torch 按平台分流:
#   - macOS(本地开发/CPU+MPS): 走 PyPI 默认轮子, P0 逻辑测试足够
#   - Linux(服务器/CUDA): 走 cu128 index, 与 RTX 5090 + CUDA 12.8 对齐
# 注: 服务器实际用 conda 预装的 torch, 不经过 uv; 此处 Linux 分支仅供 Linux 下 uv 场景。
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
